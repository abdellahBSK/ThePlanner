name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t theplanner .
      - run: docker run -d --name planner -p 3000:3000 theplanner
      - name: Sign up and read the plan through the API
        run: |
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health && break; sleep 1; done
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.com","password":"a-long-password","timezone":"UTC"}' localhost:3000/api/auth/signup
          curl -fsS -b jar -X POST localhost:3000/api/demo > /dev/null
          curl -fsS -b jar localhost:3000/api/state | grep -q '"tasks":\[{'
          curl -fsS localhost:3000/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs planner

  production-stack:
    name: Production stack (Caddy + HTTPS) smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack the way deploy/setup.sh does
        working-directory: deploy
        run: |
          printf 'DOMAIN=localhost\nEMAIL=ci@example.com\n' > .env
          docker compose up -d --build
      - name: Reach the app over HTTPS through Caddy
        run: |
          for i in $(seq 1 40); do curl -fsSk https://localhost/api/health && break; sleep 3; done
          curl -fsSk https://localhost/api/health
          curl -fsSk https://localhost/ | grep -q '<div id="root">'
          curl -fsSkI https://localhost/ | grep -i strict-transport-security
      - name: Run the backup script
        working-directory: deploy
        run: |
          ./backup.sh
          docker compose exec -T app ls /data/backups
      - if: failure()
        working-directory: deploy
        run: docker compose logs
