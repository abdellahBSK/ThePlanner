<title>Focus Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column workbench. Sticky header with the day's hour meter, tabs, then the active view.
   Days are measured like a ruler in hours; categories carry a colour stripe. */
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --sunken: #e9ede9;
  --ink: #15211c;
  --muted: #5a6962;
  --line: #d8dfda;
  --accent: #e3a40f;
  --accent-ink: #1f1600;
  --accent-text: #8a5d00;
  --danger: #b8382a;
  --danger-bg: #fbeae7;
  --ok: #24804f;
  --c-course: #2f6ad0;
  --c-lab: #7b4fd0;
  --c-interview: #0d8a8c;
  --c-portfolio: #c33a5c;
  --c-career: #5f6f7a;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #161f1b; --sunken: #111916; --ink: #e6eee9; --muted: #93a49c; --line: #26332d;
    --accent: #f1b630; --accent-ink: #1f1600; --accent-text: #f1b630; --danger: #ff8170; --danger-bg: #3a1c18; --ok: #5ccf8d;
    --c-course: #6b9cf0; --c-lab: #a98bf0; --c-interview: #3cc3c4; --c-portfolio: #f0718f; --c-career: #9fb0bb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #161f1b; --sunken: #111916; --ink: #e6eee9; --muted: #93a49c; --line: #26332d;
  --accent: #f1b630; --accent-ink: #1f1600; --accent-text: #f1b630; --danger: #ff8170; --danger-bg: #3a1c18; --ok: #5ccf8d;
  --c-course: #6b9cf0; --c-lab: #a98bf0; --c-interview: #3cc3c4; --c-portfolio: #f0718f; --c-career: #9fb0bb;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; padding-block: 14px 10px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 4.2vw, 30px); line-height: 1.05; text-wrap: balance; }
.summary { display: flex; gap: 18px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-data); font-size: 18px; font-weight: 600; }
.stat span { font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 0 8px; scrollbar-width: none; }
nav.tabs a { text-decoration: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); white-space: nowrap; }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav.tabs a:hover:not([aria-current="page"]) { background: var(--sunken); color: var(--ink); }

main { padding-block: 18px 64px; display: flex; flex-direction: column; gap: 22px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 19px; margin: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head .hint { color: var(--muted); font-size: 13px; }
section { display: flex; flex-direction: column; gap: 10px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }

/* Day panel: the ruler */
.daypanel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.daypanel-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.stepper button { border: 0; background: transparent; width: 34px; height: 32px; cursor: pointer; font-size: 18px; line-height: 1; }
.stepper button:hover { background: var(--sunken); }
.stepper output { min-width: 56px; text-align: center; font-family: var(--font-data); font-weight: 600; }
.ruler { position: relative; height: 26px; border-radius: 6px; background: var(--sunken); overflow: hidden; display: flex; }
.ruler .seg { height: 100%; border-right: 2px solid var(--surface); }
.ruler .seg.done { opacity: .35; }
.ticks { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.cap-label { color: var(--muted); font-size: 13px; }

.alert { border: 1px solid var(--danger); background: var(--danger-bg); color: var(--ink); border-radius: var(--radius); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.alert strong { color: var(--danger); }
.alert ul { margin: 0; padding-left: 18px; }

/* Block cards */
.blocks { display: flex; flex-direction: column; gap: 8px; }
.block { display: grid; grid-template-columns: 4px 1fr auto; gap: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 12px 0; overflow: hidden; }
.block .stripe { border-radius: 0 3px 3px 0; }
.block .body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.block .title { font-weight: 600; overflow-wrap: anywhere; }
.block.is-done .title { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12.5px; color: var(--muted); align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--sunken); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.chip.risk { background: var(--danger-bg); color: var(--danger); }
.chip.soon { color: var(--accent-text); }
.chip.est { border: 1px dashed var(--muted); background: transparent; }
.block .side { display: flex; flex-direction: column; align-items: end; gap: 6px; }
.block .hours { font-family: var(--font-data); font-weight: 600; font-size: 15px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: end; }
.progress { height: 4px; border-radius: 2px; background: var(--sunken); overflow: hidden; width: 100%; max-width: 220px; }
.progress i { display: block; height: 100%; background: var(--ok); }

.habit { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.habit .title { flex: 1; min-width: 0; font-weight: 600; }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--c-interview); background: transparent; cursor: pointer; display: grid; place-items: center; flex: none; }
.check[aria-pressed="true"] { background: var(--c-interview); color: var(--surface); }
.check svg { width: 14px; height: 14px; }

.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); }

/* Week */
.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.daycard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.daycard.today { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.daycard header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.daycard .dname { font-family: var(--font-display); font-weight: 700; }
.daycard .ddate { color: var(--muted); font-size: 12.5px; }
.mini { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
.mini .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; }
.mini .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mini .h { font-family: var(--font-data); color: var(--muted); font-size: 12px; white-space: nowrap; }
.daycard .stepper button { width: 28px; height: 26px; font-size: 15px; }
.daycard .stepper output { min-width: 44px; font-size: 13px; }

/* Tasks */
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.project { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.project > header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.project > header h3 { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.project .pbar { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.project .pbar .progress { width: 120px; }
.trow { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; padding: 10px 14px; border-top: 1px solid var(--line); }
.project > header + .trow { border-top: 0; }
.trow .title { font-weight: 600; overflow-wrap: anywhere; }
.trow.done .title { text-decoration: line-through; color: var(--muted); }
.trow .tick { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; margin-top: 1px; }
.trow .tick[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.trow .tick svg { width: 13px; height: 13px; }
.editor { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; background: var(--sunken); border-radius: 8px; padding: 12px; }
.editor .wide { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 0; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 9px; font-size: 14px; font-weight: 400; color: var(--ink); width: 100%; }
.field textarea { min-height: 60px; resize: vertical; }
.check-field { flex-direction: row; align-items: center; gap: 8px; }
.check-field input { width: auto; }
.editor .row-actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
details.add { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.add summary { cursor: pointer; padding: 10px 14px; font-weight: 700; list-style: none; }
details.add summary::-webkit-details-marker { display: none; }
details.add summary::before { content: "+ "; color: var(--accent-text); }
details.add .editor { margin: 0 12px 12px; }

/* Setup */
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.daytoggles { display: flex; flex-wrap: wrap; gap: 4px; }
.daytoggles button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); }
.daytoggles button[aria-pressed="true"] { background: var(--c-interview); border-color: var(--c-interview); color: var(--surface); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); }
.statusline { color: var(--muted); font-size: 13px; }

@media (max-width: 560px) {
  .block { grid-template-columns: 4px 1fr; }
  .block .side { grid-column: 2; align-items: stretch; flex-direction: row; justify-content: space-between; flex-wrap: wrap; padding-top: 6px; }
  .actions { justify-content: start; }
}
@media (prefers-reduced-motion: no-preference) {
  .ruler .seg { transition: width .25s ease; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="top-inner">
      <div class="brand">
        <span class="eyebrow" id="today-label">Today</span>
        <h1>Focus Board</h1>
      </div>
      <div class="summary" id="summary" aria-live="polite"></div>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#today" data-view="today">Today</a>
      <a href="#week" data-view="week">Week</a>
      <a href="#tasks" data-view="tasks">Tasks</a>
      <a href="#setup" data-view="setup">Setup</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view">
  <div class="empty" id="loading">Loading your tasks and plan…</div>
</main>
<div id="toast" role="status" hidden></div>

<script>
// FOCUS-SCHEDULER-START
/*SCHEDULER*/

</script>
<script>
(() => {
  const CATS = {
    course: { label: "Courses", color: "var(--c-course)" },
    lab: { label: "Labs", color: "var(--c-lab)" },
    portfolio: { label: "Portfolio", color: "var(--c-portfolio)" },
    interview: { label: "Interview prep", color: "var(--c-interview)" },
    career: { label: "Career", color: "var(--c-career)" },
  };
  const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const DAY_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const DEFAULT_CONFIG = { weekdayHours: [4, 3, 3, 3, 3, 3, 5], dayStart: ["10:00", "18:00", "18:00", "18:00", "18:00", "18:00", "10:00"], overrides: {}, maxPerTaskPerDay: 3, morningTime: "07:52", eveningTime: "21:17" };
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

  const state = { items: [], config: { ...DEFAULT_CONFIG }, configExists: false, loadedTasks: false, db: null, error: "", view: "today", filter: "all", showDone: false, editing: null, confirmDelete: null, today: isoDate(new Date()) };
  const view = document.getElementById("view");

  // ---------- helpers ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const r2 = x => Math.round(x * 100) / 100;
  function fmtH(h) {
    h = r2(h); if (h <= 0) return "0m";
    const hh = Math.floor(h + 1e-9), mm = Math.round((h - hh) * 60);
    return hh && mm ? `${hh}h ${mm}m` : hh ? `${hh}h` : `${mm}m`;
  }
  function fmtDate(s, long) {
    const d = parseIso(s);
    return long ? `${DAY_NAMES[d.getDay()]} ${d.getDate()} ${d.toLocaleString("en-GB", { month: "long" })}`
                : `${DAY_SHORT[d.getDay()]} ${d.getDate()} ${d.toLocaleString("en-GB", { month: "short" })}`;
  }
  function dueChip(t, risk) {
    if (!t.due) return "";
    const n = daysBetween(state.today, t.due);
    let txt = n < 0 ? `overdue ${-n}d` : n === 0 ? "due today" : n === 1 ? "due tomorrow" : `due ${fmtDate(t.due)}`;
    const cls = risk || n < 0 ? "risk" : n <= 3 ? "soon" : "";
    const est = t.dueEstimated ? ` est` : "";
    return `<span class="chip ${cls}${est}" title="${t.dueEstimated ? "Estimated deadline: set the real one in Tasks" : "Deadline"}">${t.dueEstimated ? "≈ " : ""}${txt}</span>`;
  }
  const catColor = c => (CATS[c] || CATS.career).color;
  const byId = id => state.items.find(t => t.id === id);
  const loggedOn = (t, d) => (t.log && t.log[d]) || 0;
  const loggedTotal = t => Object.values(t.log || {}).reduce((a, b) => a + b, 0);
  function toast(msg) {
    const el = document.getElementById("toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2200);
  }

  // ---------- data ----------
  async function write(fn, okMsg) {
    if (!state.db) { toast("Can't save: the planner data isn't connected."); return; }
    try { await fn(); if (okMsg) toast(okMsg); }
    catch (e) {
      const c = e && e.code;
      toast(c === "invalid_argument" ? "You don't have permission to change this planner." : c === "quota_exceeded" ? "Storage is full. Delete some finished tasks." : "Couldn't save. Check your connection and try again.");
    }
  }
  const taskRef = id => state.db.doc("tasks/" + id);
  async function saveConfig(patch) {
    const next = { ...state.config, ...patch };
    state.config = next; render();
    await write(() => state.configExists ? state.db.doc("config/main").update(patch) : state.db.doc("config/main").set(next));
  }
  function setTodayLog(t, hours) {
    const log = { ...(t.log || {}) }; log[state.today] = r2(Math.max(0, hours));
    return write(() => taskRef(t.id).update({ log }));
  }

  // ---------- plan ----------
  function plan() { return buildPlan(state.items, state.config, state.today, 42); }

  // ---------- views ----------
  function renderSummary(p) {
    const d0 = p.days[0];
    const planned = d0.blocks.reduce((s, b) => s + b.hours, 0) + d0.habitHours;
    const remaining = state.items.filter(t => t.kind !== "habit" && t.status === "todo").reduce((s, t) => s + remainingAtStart(t, state.today), 0);
    const lastFinish = Object.values(p.finish).filter(Boolean).sort().pop();
    document.getElementById("today-label").textContent = fmtDate(state.today, true);
    document.getElementById("summary").innerHTML = `
      <div class="stat"><b>${fmtH(planned)}</b><span>planned today</span></div>
      <div class="stat"><b>${fmtH(remaining)}</b><span>of work left</span></div>
      <div class="stat"><b>${lastFinish ? fmtDate(lastFinish) : "–"}</b><span>all done by</span></div>
      <div class="stat"><b style="color:${p.atRisk.length ? "var(--danger)" : "var(--ok)"}">${p.atRisk.length}</b><span>deadlines at risk</span></div>`;
  }

  function stepper(date, value, small) {
    return `<span class="stepper" role="group" aria-label="Hours available on ${fmtDate(date)}">
      <button type="button" data-action="hours-dec" data-date="${date}" aria-label="Fewer hours">−</button>
      <output class="num">${fmtH(value) === "0m" ? "0h" : fmtH(value)}</output>
      <button type="button" data-action="hours-inc" data-date="${date}" aria-label="More hours">+</button></span>`;
  }

  function riskAlert(p) {
    if (!p.atRisk.length) return "";
    const rows = p.atRisk.map(id => {
      const t = byId(id), f = p.finish[id];
      return `<li><b>${esc(t.title)}</b>: due ${fmtDate(t.due)}${t.dueEstimated ? " (estimated)" : ""}, finishes ${f ? fmtDate(f) : "after the next 6 weeks"}.</li>`;
    }).join("");
    return `<div class="alert" role="alert"><strong>${p.atRisk.length === 1 ? "A deadline" : p.atRisk.length + " deadlines"} won't be met at your current hours</strong>
      <ul>${rows}</ul><span class="small muted">Add hours on the coming days, lower an estimate, or move a deadline in Tasks.</span></div>`;
  }

  function blockCard(b, date, isToday, p) {
    const t = byId(b.taskId); if (!t) return "";
    const logged = isToday ? loggedOn(t, date) : 0;
    const done = isToday && logged >= b.hours - 1e-6;
    const pct = Math.min(100, Math.round((loggedTotal(t) / Math.max(t.estimate || 1, 0.01)) * 100));
    const risk = p.atRisk.includes(t.id);
    return `<article class="block${done ? " is-done" : ""}">
      <span class="stripe" style="background:${catColor(t.category)}"></span>
      <div class="body">
        <span class="title">${esc(t.title)}</span>
        <div class="meta"><span>${esc(t.project)}</span>${dueChip(t, risk)}${t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener">Open</a>` : ""}</div>
        <div class="progress" title="${pct}% of the estimate logged"><i style="width:${pct}%"></i></div>
      </div>
      <div class="side">
        <span class="hours">${isToday && logged ? `<span class="muted">${fmtH(logged)} / </span>` : ""}${fmtH(b.hours)}</span>
        ${isToday ? `<div class="actions">
          <button class="btn" data-action="log30" data-id="${t.id}">+30 min</button>
          ${done ? "" : `<button class="btn" data-action="done-today" data-id="${t.id}" data-hours="${b.hours}">Done for today</button>`}
          <button class="btn primary" data-action="finish" data-id="${t.id}">Task finished</button>
        </div>` : ""}
      </div>
    </article>`;
  }

  function habitRow(h, date) {
    const on = loggedOn(h, date) > 0;
    return `<div class="habit">
      <button class="check" aria-pressed="${on}" data-action="habit" data-id="${h.id}" aria-label="${on ? "Mark not done" : "Mark done"}: ${esc(h.title)}">${on ? CHECK : ""}</button>
      <span class="title">${esc(h.title)}</span>
      <span class="num muted small">${h.minutes} min</span>
      ${h.link ? `<a class="small" href="${esc(h.link)}" target="_blank" rel="noopener">Open</a>` : ""}
    </div>`;
  }

  function ruler(day, isToday) {
    const total = Math.max(day.capacity, 0.01);
    const segs = [];
    for (const h of habitsOn(state.items, day.date)) segs.push({ w: h.minutes / 60, c: catColor("interview"), done: isToday && loggedOn(h, day.date) > 0 });
    for (const b of day.blocks) { const t = byId(b.taskId); segs.push({ w: b.hours, c: catColor(t && t.category), done: isToday && t && loggedOn(t, day.date) >= b.hours - 1e-6 }); }
    const maxTick = Math.max(1, Math.ceil(total));
    const ticks = Array.from({ length: maxTick + 1 }, (_, i) => `<span>${i}h</span>`).join("");
    return `<div class="ruler" aria-hidden="true">${segs.map(s => `<span class="seg${s.done ? " done" : ""}" style="width:${(s.w / Math.max(total, maxTick)) * 100}%;background:${s.c}"></span>`).join("")}</div>
      <div class="ticks" aria-hidden="true" style="width:${(maxTick / Math.max(total, maxTick)) * 100}%">${ticks}</div>`;
  }

  function renderToday(p) {
    const d0 = p.days[0], d1 = p.days[1];
    const habits = habitsOn(state.items, state.today);
    const planned = d0.blocks.reduce((s, b) => s + b.hours, 0) + d0.habitHours;
    const tomorrow = d1.blocks.map(b => { const t = byId(b.taskId); return t ? `<div class="mini"><span class="dot" style="background:${catColor(t.category)}"></span><span class="t">${esc(t.title)}</span><span class="h">${fmtH(b.hours)}</span></div>` : ""; }).join("");
    return `
      <section class="daypanel" aria-label="Today's time">
        <div class="daypanel-row">
          <div><h2>${fmtH(planned)} planned</h2><span class="cap-label">Hours I have today</span></div>
          ${stepper(state.today, d0.capacity)}
        </div>
        ${ruler(d0, true)}
      </section>
      ${riskAlert(p)}
      ${habits.length ? `<section><div class="section-head"><h2>Practice</h2><span class="hint">Interview prep, every day it's scheduled</span></div>${habits.map(h => habitRow(h, state.today)).join("")}</section>` : ""}
      <section>
        <div class="section-head"><h2>Work blocks</h2><span class="hint">Earliest deadline first</span></div>
        <div class="blocks">${d0.blocks.length ? d0.blocks.map(b => blockCard(b, state.today, true, p)).join("") :
          `<div class="empty">${d0.capacity === 0 ? "Day off. Nothing is scheduled today." : "Nothing left to plan. Add a task in Tasks."}</div>`}</div>
      </section>
      <section>
        <div class="section-head"><h2>Tomorrow</h2><span class="hint">${fmtDate(d1.date, true)} · ${fmtH(d1.capacity)} available</span></div>
        <div class="daycard">${tomorrow || `<span class="muted small">Nothing scheduled.</span>`}</div>
      </section>`;
  }

  function renderWeek(p) {
    const cards = p.days.slice(0, 7).map((d, i) => {
      const habits = habitsOn(state.items, d.date);
      const items = habits.map(h => `<div class="mini"><span class="dot" style="background:${catColor("interview")}"></span><span class="t">${esc(h.title)}</span><span class="h">${h.minutes}m</span></div>`)
        .concat(d.blocks.map(b => { const t = byId(b.taskId); const risk = p.atRisk.includes(b.taskId) && t.due < addDays(d.date, 1);
          return `<div class="mini"><span class="dot" style="background:${catColor(t.category)}"></span><span class="t">${esc(t.title)}${p.finish[t.id] === d.date ? ` <span class="chip">finishes</span>` : ""}${t.due === d.date ? ` <span class="chip ${risk ? "risk" : "soon"}">due</span>` : ""}</span><span class="h">${fmtH(b.hours)}</span></div>`; }));
      return `<article class="daycard${i === 0 ? " today" : ""}">
        <header><div><div class="dname">${i === 0 ? "Today" : DAY_NAMES[weekday(d.date)]}</div><div class="ddate">${fmtDate(d.date)}</div></div>${stepper(d.date, d.capacity, true)}</header>
        ${ruler(d, i === 0)}
        ${items.join("") || `<span class="muted small">Free day.</span>`}
      </article>`;
    }).join("");
    const later = p.days.slice(7).reduce((s, d) => s + d.blocks.reduce((a, b) => a + b.hours, 0), 0);
    return `${riskAlert(p)}
      <section><div class="section-head"><h2>Next 7 days</h2><span class="hint">Change a day's hours and the plan reflows</span></div><div class="week">${cards}</div></section>
      <p class="statusline">${later ? `${fmtH(later)} more is planned after this week.` : "Everything fits in this week."}</p>`;
  }

  function editorFields(t, prefix) {
    const projects = [...new Set(state.items.map(x => x.project))].sort();
    return `
      <label class="field wide">Title<input id="${prefix}-title" value="${esc(t.title)}" required></label>
      <label class="field">Project<input id="${prefix}-project" list="project-list" value="${esc(t.project)}"></label>
      <label class="field">Category<select id="${prefix}-category">${Object.entries(CATS).filter(([k]) => k !== "interview" || t.kind === "habit").map(([k, v]) => `<option value="${k}"${t.category === k ? " selected" : ""}>${v.label}</option>`).join("")}</select></label>
      <label class="field">Deadline<input id="${prefix}-due" type="date" value="${esc(t.due || "")}"></label>
      <label class="field check-field"><input id="${prefix}-confirmed" type="checkbox"${t.due && !t.dueEstimated ? " checked" : ""}> Real deadline (not a guess)</label>
      <label class="field">Estimate (hours)<input id="${prefix}-estimate" type="number" min="0.25" step="0.25" value="${t.estimate ?? 1}"></label>
      <label class="field">Priority<select id="${prefix}-priority">${[[3, "High"], [2, "Normal"], [1, "Low"]].map(([v, l]) => `<option value="${v}"${(t.priority || 2) === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="field">Status<select id="${prefix}-status">${[["todo", "To do"], ["waiting", "Waiting (not scheduled)"], ["done", "Done"]].map(([v, l]) => `<option value="${v}"${t.status === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="field">Link<input id="${prefix}-link" type="url" value="${esc(t.link || "")}" placeholder="https://"></label>
      <label class="field wide">Notes<textarea id="${prefix}-notes">${esc(t.notes || "")}</textarea></label>
      <datalist id="project-list">${projects.map(x => `<option value="${esc(x)}">`).join("")}</datalist>`;
  }
  function readEditor(prefix) {
    const v = id => document.getElementById(`${prefix}-${id}`);
    const due = v("due").value || null;
    return {
      title: v("title").value.trim(), project: v("project").value.trim() || "Other", category: v("category").value,
      due, dueEstimated: due ? !v("confirmed").checked : false, estimate: Math.max(0.25, parseFloat(v("estimate").value) || 1),
      priority: parseInt(v("priority").value, 10), status: v("status").value, link: v("link").value.trim(), notes: v("notes").value.trim(),
    };
  }

  function renderTasks(p) {
    const filters = [["all", "All"], ...Object.entries(CATS).map(([k, v]) => [k, v.label])];
    let tasks = state.items.filter(t => t.kind !== "habit");
    if (state.filter !== "all") tasks = tasks.filter(t => t.category === state.filter);
    const groups = new Map();
    for (const t of tasks.sort((a, b) => (a.due || "9999") < (b.due || "9999") ? -1 : 1)) {
      if (!groups.has(t.project)) groups.set(t.project, []); groups.get(t.project).push(t);
    }
    const blank = { title: "", project: "", category: state.filter !== "all" && state.filter !== "interview" ? state.filter : "portfolio", due: "", estimate: 2, priority: 2, status: "todo", link: "", notes: "" };
    const projectsHtml = [...groups.entries()].map(([name, list]) => {
      const est = list.reduce((s, t) => s + (t.estimate || 0), 0);
      const done = list.reduce((s, t) => s + (t.status === "done" ? (t.estimate || 0) : Math.min(loggedTotal(t), t.estimate || 0)), 0);
      const visible = state.showDone ? list : list.filter(t => t.status !== "done");
      const pct = est ? Math.round((done / est) * 100) : 0;
      const rows = visible.map(t => {
        const editing = state.editing === t.id;
        return `<div class="trow${t.status === "done" ? " done" : ""}">
          <button class="tick" aria-pressed="${t.status === "done"}" data-action="toggle-done" data-id="${t.id}" aria-label="${t.status === "done" ? "Mark not done" : "Mark finished"}: ${esc(t.title)}">${t.status === "done" ? CHECK : ""}</button>
          <div style="min-width:0;display:flex;flex-direction:column;gap:4px">
            <span class="title">${esc(t.title)}</span>
            <div class="meta">${dueChip(t, p.atRisk.includes(t.id))}<span class="chip num">${fmtH(t.estimate)}${loggedTotal(t) ? ` · ${fmtH(loggedTotal(t))} done` : ""}</span>${t.status === "waiting" ? `<span class="chip">waiting</span>` : ""}${(t.priority || 2) === 3 ? `<span class="chip soon">high</span>` : ""}${p.finish[t.id] ? `<span>planned to finish ${fmtDate(p.finish[t.id])}</span>` : ""}</div>
            ${t.notes && !editing ? `<span class="small muted">${esc(t.notes)}</span>` : ""}
          </div>
          <button class="btn ghost" data-action="edit" data-id="${t.id}" aria-expanded="${editing}">${editing ? "Close" : "Edit"}</button>
          ${editing ? `<form class="editor" data-form="edit" data-id="${t.id}">${editorFields(t, "e")}
            <div class="row-actions">
              ${state.confirmDelete === t.id ? `<span><button type="button" class="btn danger" data-action="delete" data-id="${t.id}">Delete for good</button> <button type="button" class="btn ghost" data-action="cancel-delete">Keep it</button></span>`
                : `<button type="button" class="btn danger" data-action="ask-delete" data-id="${t.id}">Delete</button>`}
              <button type="submit" class="btn primary">Save</button></div></form>` : ""}
        </div>`;
      }).join("");
      return `<article class="project"><header><h3>${esc(name)}</h3><div class="pbar"><div class="progress"><i style="width:${pct}%"></i></div><span class="num">${pct}% · ${fmtH(Math.max(0, est - done))} left</span></div></header>
        ${rows || `<div class="trow"><span></span><span class="muted small">All finished.</span><span></span></div>`}</article>`;
    }).join("");
    return `
      <div class="toolbar" role="group" aria-label="Filter by category">${filters.map(([k, l]) => `<button class="filter" aria-pressed="${state.filter === k}" data-action="filter" data-filter="${k}">${l}</button>`).join("")}
        <label class="small muted" style="margin-left:auto;display:flex;gap:6px;align-items:center"><input type="checkbox" id="show-done"${state.showDone ? " checked" : ""}> Show finished</label></div>
      <details class="add"${state.editing === "new" ? " open" : ""}><summary>Add a task</summary>
        <form class="editor" data-form="new">${editorFields(blank, "n")}<div class="row-actions"><span></span><button type="submit" class="btn primary">Add task</button></div></form></details>
      ${projectsHtml || `<div class="empty">No tasks in this category yet. Use “Add a task” above.</div>`}`;
  }

  function renderSetup() {
    const c = state.config;
    const habits = state.items.filter(t => t.kind === "habit");
    return `
      <section class="card">
        <div class="section-head"><h2>Usual hours per day</h2><span class="hint">Outside classes. Change a single day from Today or Week.</span></div>
        <div class="setup-grid">${DAY_NAMES.map((n, i) => `<label class="field">${n}<input type="number" min="0" max="16" step="0.5" id="wd-${i}" data-action="weekday-hours" data-day="${i}" value="${c.weekdayHours[i]}"></label>`).join("")}</div>
        <div class="section-head"><h2>Start time per day</h2><span class="hint">Calendar blocks start here and skip anything already on your calendar</span></div>
        <div class="setup-grid">${DAY_NAMES.map((n, i) => `<label class="field">${n}<input type="time" id="ds-${i}" data-action="day-start" data-day="${i}" value="${esc((c.dayStart || DEFAULT_CONFIG.dayStart)[i])}"></label>`).join("")}</div>
        <label class="field" style="max-width:260px">Most hours on one task per day<input type="number" min="0.5" max="12" step="0.5" id="max-per" data-action="max-per" value="${c.maxPerTaskPerDay}"></label>
      </section>
      <section class="card">
        <div class="section-head"><h2>Interview practice</h2><span class="hint">Counted before other work each day it's on</span></div>
        ${habits.map(h => `<div style="display:flex;flex-direction:column;gap:6px">
          <strong>${esc(h.title)}</strong>
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
            <label class="field" style="flex-direction:row;align-items:center;gap:6px">Minutes <input type="number" min="5" max="240" step="5" id="hm-${h.id}" data-action="habit-minutes" data-id="${h.id}" value="${h.minutes}" style="width:80px"></label>
            <div class="daytoggles" role="group" aria-label="Days">${DAY_SHORT.map((d, i) => `<button type="button" data-action="habit-day" data-id="${h.id}" data-day="${i}" aria-pressed="${(h.days || []).includes(i)}">${d}</button>`).join("")}</div>
          </div></div>`).join("") || `<span class="muted small">No practice habits yet.</span>`}
      </section>
      <section class="card">
        <h2>Reminders</h2>
        <p class="small" style="margin:0">Every morning at <b class="num">${esc(c.morningTime)}</b> you get today's plan as a notification, and the work blocks are added to your Google Calendar from each day's start time, around anything already on it. New ILISI3 assignments from the coach are added to your tasks automatically. At <b class="num">${esc(c.eveningTime)}</b> you get a check-in: tick off what you did here, and anything unfinished moves to the next days automatically.</p>
        <p class="small muted" style="margin:0">To change the reminder times, ask Claude in the chat that set this up.</p>
      </section>`;
  }

  function render() {
    for (const a of document.querySelectorAll("nav.tabs a")) a.setAttribute("aria-current", a.dataset.view === state.view ? "page" : "false");
    if (state.error) { view.innerHTML = `<div class="empty">${esc(state.error)}</div>`; return; }
    if (!state.loadedTasks) { view.innerHTML = `<div class="empty">${state.slow ? "Your tasks can't be reached yet. Check your connection; the page keeps trying." : "Loading your tasks and plan…"}</div>`; return; }
    const p = plan();
    renderSummary(p);
    const focusId = document.activeElement && document.activeElement.id;
    if (state.items.length === 0) view.innerHTML = `<div class="empty">No tasks yet. Open Tasks and add the first one.</div>`;
    else view.innerHTML = state.view === "week" ? renderWeek(p) : state.view === "tasks" ? renderTasks(p) : state.view === "setup" ? renderSetup() : renderToday(p);
    if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
  }

  // ---------- events ----------
  function hoursFor(date) { return hoursAvailable(state.config, date); }
  view.addEventListener("click", async e => {
    const el = e.target.closest("[data-action]"); if (!el) return;
    const a = el.dataset.action, id = el.dataset.id, t = id ? byId(id) : null;
    if (a === "hours-inc" || a === "hours-dec") {
      const d = el.dataset.date, v = Math.max(0, Math.min(16, hoursFor(d) + (a === "hours-inc" ? 0.5 : -0.5)));
      const overrides = { ...(state.config.overrides || {}) };
      for (const k of Object.keys(overrides)) if (k < state.today) delete overrides[k];
      overrides[d] = v;
      await saveConfig({ overrides });
    } else if (a === "log30" && t) { await setTodayLog(t, loggedOn(t, state.today) + 0.5); toast(`Logged 30 min on ${t.project}`); }
    else if (a === "done-today" && t) { await setTodayLog(t, Math.max(loggedOn(t, state.today), parseFloat(el.dataset.hours))); toast("Done for today"); }
    else if (a === "finish" && t) {
      const log = { ...(t.log || {}) }; if (!log[state.today]) log[state.today] = 0.25;
      await write(() => taskRef(t.id).update({ status: "done", doneAt: state.today, log }), "Task finished. Nice.");
    }
    else if (a === "habit" && t) await setTodayLog(t, loggedOn(t, state.today) > 0 ? 0 : t.minutes / 60);
    else if (a === "toggle-done" && t) await write(() => taskRef(t.id).update(t.status === "done" ? { status: "todo", doneAt: null } : { status: "done", doneAt: state.today }), t.status === "done" ? "Moved back to to-do" : "Task finished");
    else if (a === "filter") { state.filter = el.dataset.filter; render(); }
    else if (a === "edit") { state.editing = state.editing === id ? null : id; state.confirmDelete = null; render(); }
    else if (a === "ask-delete") { state.confirmDelete = id; render(); }
    else if (a === "cancel-delete") { state.confirmDelete = null; render(); }
    else if (a === "delete" && t) { state.editing = null; state.confirmDelete = null; await write(() => taskRef(id).delete(), "Task deleted"); }
    else if (a === "habit-day" && t) {
      const day = parseInt(el.dataset.day, 10), days = new Set(t.days || []);
      days.has(day) ? days.delete(day) : days.add(day);
      await write(() => taskRef(t.id).update({ days: [...days].sort() }));
    }
  });
  view.addEventListener("change", async e => {
    const el = e.target;
    if (el.id === "show-done") { state.showDone = el.checked; render(); return; }
    const a = el.dataset.action;
    if (a === "weekday-hours") { const wh = [...state.config.weekdayHours]; wh[+el.dataset.day] = Math.max(0, Math.min(16, parseFloat(el.value) || 0)); await saveConfig({ weekdayHours: wh }); }
    else if (a === "day-start") { const ds = [...(state.config.dayStart || DEFAULT_CONFIG.dayStart)]; ds[+el.dataset.day] = el.value || ds[+el.dataset.day]; await saveConfig({ dayStart: ds }); }
    else if (a === "max-per") await saveConfig({ maxPerTaskPerDay: Math.max(0.5, parseFloat(el.value) || 3) });
    else if (a === "habit-minutes") { const t = byId(el.dataset.id); if (t) await write(() => taskRef(t.id).update({ minutes: Math.max(5, parseInt(el.value, 10) || 30) }), "Saved"); }
  });
  view.addEventListener("submit", async e => {
    e.preventDefault();
    const form = e.target;
    if (form.dataset.form === "edit") {
      const f = readEditor("e"); if (!f.title) { toast("Give the task a title."); return; }
      const id = form.dataset.id; state.editing = null;
      await write(() => taskRef(id).update({ ...f, doneAt: f.status === "done" ? (byId(id).doneAt || state.today) : null }), "Saved");
    } else if (form.dataset.form === "new") {
      const f = readEditor("n"); if (!f.title) { toast("Give the task a title."); return; }
      const id = f.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" + Math.random().toString(36).slice(2, 6);
      state.editing = null;
      await write(() => taskRef(id).set({ ...f, id, kind: "task", log: {}, createdAt: state.today }), "Task added and scheduled");
    }
  });

  function route() {
    const h = (location.hash || "#today").slice(1);
    state.view = ["today", "week", "tasks", "setup"].includes(h) ? h : "today";
    state.editing = null; render();
  }
  window.addEventListener("hashchange", route);
  // Roll over at midnight or when the tab wakes up on a new day.
  setInterval(() => { const d = isoDate(new Date()); if (d !== state.today) { state.today = d; render(); } }, 60000);
  document.addEventListener("visibilitychange", () => { const d = isoDate(new Date()); if (d !== state.today) { state.today = d; render(); } });

  // ---------- boot ----------
  route();
  (async () => {
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if (!db) { state.error = "Open this planner from your Claude account to load your tasks."; render(); return; }
    state.db = db;
    const slow = setTimeout(() => { state.slow = true; render(); }, 10000);
    db.collection("tasks").onSnapshot(snap => {
      state.items = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      if (!snap.metadata.fromCache) { state.loadedTasks = true; clearTimeout(slow); state.slow = false; }
      else if (snap.size) state.loadedTasks = true;
      render();
    }, err => { clearTimeout(slow); state.error = err.code === "revoked" ? "This planner is no longer available to you." : "Your tasks couldn't be loaded. Reload the page to try again."; render(); });
    db.doc("config/main").onSnapshot(snap => {
      state.configExists = snap.exists;
      state.config = snap.exists ? { ...DEFAULT_CONFIG, ...snap.data() } : { ...DEFAULT_CONFIG };
      render();
    }, () => {});
  })();
})();
</script>
